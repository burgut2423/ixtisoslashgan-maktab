services:
  - type: web
    name: qoshkopir-ixtisoslashtirilgan-maktab
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: node server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
